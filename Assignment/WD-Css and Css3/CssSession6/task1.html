<!DOCTYPE html>
<html>
<head>
    <title>Favorite Food List</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }


        ul {
            list-style: none; /* Remove default bullets */
            width: 300px;
        }


        li {
            padding: 12px;
            margin: 10px 0;

            font-size: 20px;

            background-color: white;

            border-radius: 8px;

            cursor: pointer;
        }


        /* Add emoji bullets */
        li::before {
            content: "🍴 ";
            margin-right: 10px;
        }


        /* Hover effect */
        li:hover {
            color: red;
            background-color: #ffe6e6;
        }

    </style>

</head>

<body>


    <h1>My Favorite Food Items</h1>


    <ul>

        <li> 🍕 Pizza</li>
        <li>🍔 Burger</li>
        <li> 🥐 Pasta</li>
        <li>🍗Biryani</li>
        <li> 🍿Ice Cream</li>

    </ul>


</body>
</html>
