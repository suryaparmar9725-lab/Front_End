<!DOCTYPE html>
<html>
<head>
    <title>IPL Match Table</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .table-container {
            width: 80%;
            margin: 40px auto;
        }


        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;

            background-color: white;

            /* Rounded table corners */
            border-radius: 12px;
            overflow: hidden;
        }


        th {
            background-color: #2874f0;
            color: white;

            padding: 15px;
            text-align: center;
        }


        td {
            padding: 15px;
            text-align: center;

            border-bottom: 1px solid #ddd;
        }


        /* Zebra striping */
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }


        /* Hover effect */
        tbody tr:hover {
            background-color: #ffe082;
            cursor: pointer;
        }


    </style>

</head>

<body>


    <div class="table-container">

        <h1>Recent IPL Matches</h1>


        <table>

            <thead>
                <tr>
                    <th>Team 1</th>
                    <th>Team 2</th>
                    <th>Score</th>
                    <th>Winner</th>
                </tr>
            </thead>


            <tbody>

                <tr>
                    <td>CSK</td>
                    <td>MI</td>
                    <td>185/6 - 172/8</td>
                    <td>CSK</td>
                </tr>


                <tr>
                    <td>RCB</td>
                    <td>KKR</td>
                    <td>176/5 - 170/9</td>
                    <td>RCB</td>
                </tr>


                <tr>
                    <td>GT</td>
                    <td>RR</td>
                    <td>190/4 - 185/7</td>
                    <td>GT</td>
                </tr>

            </tbody>


        </table>

    </div>


</body>
</html>
