<!DOCTYPE html>
<html>
<head>
    <title>Block, Inline and Inline-Block Example</title>

    <style>
        /* Block element */
        .home {
            display: block;
            width: 300px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
            padding: 20px;
        }

        /* Inline element */
        .explore {
            display: inline;
            background-color: lightgreen;
            padding: 20px;
            margin: 10px;
        }

        /* Inline-block element */
        .profile {
            display: inline-block;
            width: 200px;
            height: 100px;
            background-color: lightpink;
            margin: 10px;
            padding: 20px;
        }
    </style>

</head>

<body>

    <h1>App Sections</h1>

    <!-- Block Element -->
    <section class="home">
        Home Section
    </section>


    <!-- Inline Element -->
    <section class="explore">
        Explore Section
    </section>


    <!-- Inline-block Element -->
    <section class="profile">
        Profile Section
    </section>

</body>
</html>
