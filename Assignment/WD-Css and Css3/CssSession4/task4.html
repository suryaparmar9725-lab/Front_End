<!DOCTYPE html>
<html>
<head>
    <title>Float Clearfix Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        /* Parent container */
        .layout {
            background-color: white;
            padding: 20px;
            border: 2px solid #ccc;
        }

        /* Clearfix technique */
        .layout::after {
            content: "";
            display: block;
            clear: both;
        }


        /* Left column */
        .products {
            float: left;
            width: 65%;
            background-color: #e8f0fe;
            padding: 20px;
            box-sizing: border-box;
        }


        /* Right column */
        .cart {
            float: right;
            width: 30%;
            background-color: #fff3cd;
            padding: 20px;
            box-sizing: border-box;
        }


        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
        }

    </style>

</head>

<body>


    <h1>Flipkart Style Product Layout</h1>


    <!-- Parent container with clearfix -->
    <div class="layout">


        <!-- Float Left -->
        <div class="products">

            <h2>Products</h2>

            <div class="product-card">
                <h3>Mobile Phone</h3>
                <p>5G smartphone with powerful camera.</p>
            </div>

            <div class="product-card">
                <h3>Laptop</h3>
                <p>Fast laptop for coding and work.</p>
            </div>

        </div>



        <!-- Float Right -->
        <div class="cart">

            <h2>Shopping Cart</h2>

            <p>Mobile Phone × 1</p>
            <p>Laptop × 1</p>

            <h3>Total: ₹69,999</h3>

        </div>


    </div>


</body>
</html>
