<!DOCTYPE html>
<html>
<head>
    <title>Instagram Style Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
            border-bottom: 1px solid #ddd;
            padding: 15px;
            text-align: center;
        }

        /* Inline-block allows items to stay in one line
           and also allows width and height */
        .menu-item {
            display: inline-block;

            width: 120px;
            height: 40px;

            line-height: 40px;
            text-align: center;

            margin: 5px;

            background-color: #f2f2f2;
            border-radius: 8px;

            font-weight: bold;
            color: #333;

            text-decoration: none;
        }

        .menu-item:hover {
            background-color: #ff3040;
            color: white;
        }

    </style>
</head>

<body>

    <!-- Instagram Style Navbar -->
    <nav class="navbar">

        <a href="#" class="menu-item">Home</a>

        <a href="#" class="menu-item">Explore</a>

        <a href="#" class="menu-item">Reels</a>

        <a href="#" class="menu-item">Messages</a>

        <a href="#" class="menu-item">Profile</a>

    </nav>


</body>
</html>
