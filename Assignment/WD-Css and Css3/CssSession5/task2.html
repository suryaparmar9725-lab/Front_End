<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Card with Box Shadow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .product-card {
            width: 280px;

            background-color: white;

            padding: 20px;
            margin: 50px auto;

            border-radius: 10px;

            /* Soft modern shadow effect */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;

            border-radius: 8px;
        }

        .product-card h2 {
            color: #2874f0;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            background-color: #ff9f00;
            color: white;

            border: none;
            padding: 10px 20px;

            border-radius: 5px;

            cursor: pointer;
        }

        .btn:hover {
            background-color: #fb641b;
        }

    </style>

</head>

<body>


    <div class="product-card">

        <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fG1vYmlsZXxlbnwwfHwwfHx8MA%3D%3D" 
             alt="Product Image">

        <h2>Smartphone</h2>

        <p>
            Latest 5G smartphone with powerful processor
            and high-quality camera.
        </p>

        <p class="price">
            ₹19,999
        </p>

        <button class="btn">
            Buy Now
        </button>

    </div>


</body>
</html>
