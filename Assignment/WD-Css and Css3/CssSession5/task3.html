<!DOCTYPE html>
<html>
<head>
    <title>Movie Poster Text Shadow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
        }

        .movie-card {
            width: 300px;
            height: 450px;

            margin: 50px auto;

            background-image: url("https://via.placeholder.com/300x450");
            background-size: cover;
            background-position: center;

            padding: 20px;

            color: white;

            border-radius: 15px;

            display: flex;
            align-items: flex-end;
        }

        .movie-title {
            font-size: 40px;
            font-weight: bold;

            /* Text shadow makes title stand out */
            text-shadow: 
                3px 3px 5px black,
                -2px -2px 5px red;
        }

    </style>

</head>

<body>


    <div class="movie-card">

        <h1 class="movie-title">
            Avengers
        </h1>

    </div>


</body>
</html>
