<!DOCTYPE html>
<html>
<head>
    <title>Menu Styling Example</title>

    <style>
        /* Class selector: styles all menu items */
        .menu-item {
            font-style: italic;
            color: green;
        }

        /* ID selector: highlights one special menu item */
        #special-item {
            background-color: yellow;
            color: red;
        }
    </style>
</head>

<body>

    <h2>Restaurant Menu</h2>

    <ul>
        <li class="menu-item">Pizza</li>
        <li class="menu-item" id="special-item">Special Burger</li>
        <li class="menu-item">Pasta</li>
        <li class="menu-item">Sandwich</li>
    </ul>

</body>
</html>
