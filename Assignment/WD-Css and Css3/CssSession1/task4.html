<!DOCTYPE html>
<html>
<head>
    <title>CSS Grouping Selector Example</title>

    <style>
        /* Grouping selector: applies border to heading and menu items together */
        h2, li {
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h2>Restaurant Menu</h2>

    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Pasta</li>
        <li>Sandwich</li>
    </ul>

</body>
</html>
