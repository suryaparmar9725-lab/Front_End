<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App Dashboard</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Profile Card -->
    <section class="profile-card">
        <h2>Profile</h2>
        <img src="https://via.placeholder.com/120" alt="Profile Image">
        <h3>Rahul Sharma</h3>
        <p>Music Lover 🎵</p>
    </section>

    <!-- Playlist Section -->
    <section class="playlist">
        <h2>My Playlists</h2>
        <ul>
            <li>🎶 Chill Vibes</li>
            <li>🔥 Workout Mix</li>
            <li>🎧 Top Hits</li>
            <li>🌙 Night Beats</li>
        </ul>
    </section>

    <!-- Trending Hashtags Sidebar -->
    <aside class="hashtags">
        <h2>Trending Hashtags</h2>
        <ul>
            <li>#NowPlaying</li>
            <li>#MusicLife</li>
            <li>#TopCharts</li>
            <li>#NewRelease</li>
        </ul>
    </aside>

</body>
</html>
