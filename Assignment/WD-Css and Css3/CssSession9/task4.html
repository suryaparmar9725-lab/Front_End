<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Listing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #e23744;
        }

        /* =========================
           Mobile First (320px+)
           ========================= */

        .restaurant-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card h2 {
            font-size: 20px;
            color: #333;
        }

        .card p {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        /* =========================
           Tablet (768px+)
           ========================= */

        @media (min-width: 768px) {

            .restaurant-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .card h2 {
                font-size: 24px;
            }

            .card p {
                font-size: 16px;
            }
        }

        /* =========================
           Laptop (1024px+)
           ========================= */

        @media (min-width: 1024px) {

            .restaurant-container {
                grid-template-columns: repeat(3, 1fr);
            }

            .card h2 {
                font-size: 26px;
            }

            .card p {
                font-size: 17px;
            }
        }

        /* =========================
           Desktop (1200px+)
           ========================= */

        @media (min-width: 1200px) {

            .restaurant-container {
                grid-template-columns: repeat(4, 1fr);
            }

            .card h2 {
                font-size: 30px;
            }

            .card p {
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

    <h1>Zomato Restaurant Listings</h1>

    <div class="restaurant-container">

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7nceSNqBbdSc-pQ6qFrV0i7juRWIRypf_wU8LUtDhWg&s=10" alt="Restaurant">
            <div class="card-content">
                <h2>Spice Garden</h2>
                <p>North Indian • Chinese • ₹500 for two</p>
            </div>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVY0nzU7-fXxuXsmslX1ZxPpbVZP9XFpN5g0p1veKsCQ&s=10" alt="Restaurant">
            <div class="card-content">
                <h2>Pizza Hub</h2>
                <p>Italian • Pizza • ₹700 for two</p>
            </div>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDfgc2muJzvjY3616VE83ITg_gWJdHbo2FGc9FVyXvoQ&s=10" alt="Restaurant">
            <div class="card-content">
                <h2>Burger Point</h2>
                <p>Fast Food • Burgers • ₹400 for two</p>
            </div>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfRv_Z7h9ydQfoRTuP1OafLUm1TfwGnM19wzPHhQAK7g&s=10" alt="Restaurant">
            <div class="card-content">
                <h2>Royal Biryani</h2>
                <p>Biryani • Mughlai • ₹650 for two</p>
            </div>
        </div>

    </div>

</body>
</html>
