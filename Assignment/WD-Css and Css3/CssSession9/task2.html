<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Card - GSAP Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .product-card {
            width: 300px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            padding-bottom: 20px;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product-card h2 {
            margin: 15px 0 10px;
            color: #212121;
        }

        .price {
            color: #388e3c;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: #2874f0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .buy-btn:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8aGVhZHBob25lc3xlbnwwfHwwfHx8MA%3D%3D" alt="Product">

        <h2>Wireless Headphones</h2>

        <p class="price">₹2,999</p>

        <p class="description">
            Premium wireless headphones with deep bass,
            noise cancellation, and 30-hour battery life.
        </p>

        <button class="buy-btn">Buy Now</button>
    </div>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>

    <script>
        // Fade in + Slide Up Animation
        gsap.from(".product-card", {
            duration: 1.2,
            opacity: 0,
            y: 100,
            ease: "power3.out"
        });
    </script>

</body>
</html>
