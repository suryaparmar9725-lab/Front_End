<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navigation Bar */
        nav {
            background-color: #2874f0;
            padding: 15px 20px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        .nav-links li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        .hamburger {
            display: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        /* Desktop (Above 1024px) */
        @media (min-width: 1025px) {
            nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .nav-links {
                display: flex;
                flex-direction: row;
            }

            .hamburger {
                display: none;
            }
        }

        /* Tablet (768px - 1024px) */
        @media (min-width: 768px) and (max-width: 1024px) {
            nav {
                display: block;
                text-align: center;
            }

            .logo {
                display: block;
                margin-bottom: 15px;
            }

            .nav-links {
                display: flex;
                flex-direction: column;
                gap: 12px;
                align-items: center;
            }

            .hamburger {
                display: none;
            }
        }

        /* Mobile (Below 768px) */
        @media (max-width: 767px) {
            nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .nav-links {
                display: none;
            }

            .hamburger {
                display: block;
            }
        }

    </style>
</head>

<body>

    <nav>
        <div class="logo">My Portfolio</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Skills</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <!-- Placeholder Hamburger Icon -->
        <div class="hamburger">&#9776;</div>
    </nav>

</body>
</html>
