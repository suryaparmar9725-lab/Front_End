<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Contact Section</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Contact Section */
        .contact {
            background-image: linear-gradient(135deg, #6a11cb, #2575fc, #00d4ff);
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .contact h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .contact p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .contact a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 12px 25px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .contact a:hover {
            background-color: white;
            color: #2575fc;
        }
    </style>
</head>

<body>

    <section class="contact">
        <h2>Contact Me</h2>
        <p>Let's build something amazing together!</p>
        <a href="#">Get In Touch</a>
    </section>

</body>
</html>
