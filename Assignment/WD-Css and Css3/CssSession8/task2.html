<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - About Me</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* About Me Section */
        .about {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Google Font Heading */
        .about h2 {
            font-family: 'Poppins', sans-serif;
            color: #2563eb;
            font-size: 36px;
            margin-bottom: 20px;
        }

        /* About Text */
        .about p {
            color: #555;
            font-size: 18px;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <!-- About Me Section -->
    <section class="about">
        <h2>About Me</h2>

        <p>
            Hello! I'm a passionate Front-End Developer who enjoys building
            responsive and user-friendly websites using HTML, CSS, JavaScript,
            React, Bootstrap, and Tailwind CSS. I love learning new technologies
            and creating modern web applications with clean and attractive designs.
        </p>
    </section>

</body>
</html>
