<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio with Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navigation Bar */
        nav {
            background-color: #1f2937;
            padding: 15px 0;
        }

        nav ul {
            list-style: none;
            text-align: center;
        }

        nav ul li {
            display: inline-block;
            margin: 0 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Hover Effect */
        nav ul li a:hover {
            background-color: #3b82f6;
            color: #fff;
        }

        /* Portfolio Content */
        .container {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }

        .container h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .container p {
            color: #555;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Skills</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Portfolio Section -->
    <div class="container">
        <h1>My Portfolio</h1>
        <p>Welcome to my personal portfolio website. Explore my skills, projects, and contact information.</p>
    </div>

</body>
</html>
