<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery Banner</title>

    <style>
        .banner {
            height: 250px;
            padding: 40px;
            text-align: center;
            color: white;

            /* Linear gradient with two colors */
            background-image: linear-gradient(to right, #ff512f, #dd2476);
        }

        .banner h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .banner p {
            font-size: 20px;
        }

        .btn {
            background-color: white;
            color: #dd2476;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <section class="banner">
        <h1>FoodExpress</h1>
        <p>Delicious food delivered fast to your doorstep!</p>
        <button class="btn">Order Now</button>
    </section>

</body>
</html>
