<!DOCTYPE html>
<html>
<head>
    <title>Google Fonts Example</title>

    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

    <style>
        /* Apply Poppins font to all headings */
        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }

        /* Apply Roboto font to all paragraphs */
        p {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>

<body>

    <h1>Food Delivery App</h1>
    <h2>Delicious Meals Near You</h2>

    <p>
        Order your favorite food from the best restaurants and get it
        delivered quickly to your doorstep.
    </p>

    <p>
        Enjoy fresh meals with fast delivery and great offers every day.
    </p>

</body>
</html>
