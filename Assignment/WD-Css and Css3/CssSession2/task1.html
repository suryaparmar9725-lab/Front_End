<!DOCTYPE html>
<html>
<head>
    <title>Color Boxes Example</title>

    <style>
        .box {
            width: 200px;
            height: 100px;
            margin: 10px;
        }

        /* Using RGB color */
        .box1 {
            background-color: rgb(255, 0, 0);
        }

        /* Using HEX color */
        .box2 {
            background-color: #0000ff;
        }

        /* Using named color */
        .box3 {
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>

</body>
</html>
