<!DOCTYPE html>
<html>
<head>
    <title>Instagram Story Bar</title>

    <style>
        * {
            /* Ensures padding and border are included in width and height */
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .story-bar {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .story {
            width: 80px;
            height: 80px;

            /* Border and padding won't increase the circle size */
            border: 4px solid #ff2d55;
            padding: 4px;

            border-radius: 50%;
            overflow: hidden;
        }

        .story img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }


        /*
        WITHOUT box-sizing: border-box
        --------------------------------
        Width = 80px + padding + border
        Actual size becomes larger than 80px.

        WITH box-sizing: border-box
        --------------------------------
        Width and height remain 80px.
        Border and padding are included inside
        the given size, keeping all circles aligned.
        */

    </style>
</head>

<body>

    <h2>Instagram Stories</h2>

    <div class="story-bar">

        <div class="story">
            <img src="https://images.unsplash.com/photo-1615109398623-88346a601842?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bWFufGVufDB8fDB8fHww" alt="User 1">
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1581382575275-97901c2635b7?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bWFufGVufDB8fDB8fHww" alt="User 2">
        </div>

        <div class="story">
            <img src="https://plus.unsplash.com/premium_photo-1672239496290-5061cfee7ebb?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8bWFufGVufDB8fDB8fHww" alt="User 3">
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1480429370139-e0132c086e2a?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fG1hbnxlbnwwfHwwfHx8MA%3D%3D" alt="User 4">
        </div>

        <div class="story">
            <img src="https://plus.unsplash.com/premium_photo-1689977968861-9c91dbb16049?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTd8fG1hbnxlbnwwfHwwfHx8MA%3D%3D" alt="User 5">
        </div>

    </div>

</body>
</html>
