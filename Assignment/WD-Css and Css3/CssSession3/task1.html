<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Style Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            gap: 20px; /* Space between product cards */
            padding: 20px;
        }

        .product-card {
            width: 250px;
            background-color: white;

            /* Border separates each product */
            border: 1px solid #ddd;

            /* Padding creates space inside card */
            padding: 15px;

            /* Margin creates space outside card */
            margin: 10px;

            border-radius: 8px;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Flipkart Product Cards</h1>

    <div class="container">

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8bW9iaWxlfGVufDB8fDB8fHww" alt="Mobile">
            <h3>Smartphone</h3>
            <p>Latest 5G smartphone with powerful performance.</p>
            <div class="price">₹19,999</div>
            <button class="btn">Buy Now</button>
        </div>


        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8bGFwdG9wfGVufDB8fDB8fHww" alt="Laptop">
            <h3>Laptop</h3>
            <p>Fast laptop for work, study and entertainment.</p>
            <div class="price">₹49,999</div>
            <button class="btn">Buy Now</button>
        </div>

    </div>

</body>
</html>
