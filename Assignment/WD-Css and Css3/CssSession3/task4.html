<!DOCTYPE html>
<html>
<head>
    <title>YouTube Sticky Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Sticky navigation bar */
        .navbar {
            position: sticky;
            top: 0;

            background-color: #ffffff;
            padding: 15px 20px;

            display: flex;
            gap: 25px;

            border-bottom: 1px solid #ddd;
            z-index: 1000;
        }

        .navbar a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .navbar a:hover {
            color: red;
        }


        .videos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .video-card {
            height: 180px;
            background-color: #eee;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
        }

    </style>
</head>

<body>

    <!-- Sticky Navbar -->
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">Trending</a>
        <a href="#">Subscriptions</a>
        <a href="#">Library</a>
    </nav>


    <!-- Long list of videos for scrolling -->
    <section class="videos">

        <div class="video-card">Video Thumbnail 1</div>
        <div class="video-card">Video Thumbnail 2</div>
        <div class="video-card">Video Thumbnail 3</div>
        <div class="video-card">Video Thumbnail 4</div>
        <div class="video-card">Video Thumbnail 5</div>
        <div class="video-card">Video Thumbnail 6</div>
        <div class="video-card">Video Thumbnail 7</div>
        <div class="video-card">Video Thumbnail 8</div>
        <div class="video-card">Video Thumbnail 9</div>
        <div class="video-card">Video Thumbnail 10</div>
        <div class="video-card">Video Thumbnail 11</div>
        <div class="video-card">Video Thumbnail 12</div>

    </section>

</body>
</html>
