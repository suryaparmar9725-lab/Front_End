<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Verification Badge</title>
</head>
<body>

    <h2>Instagram Verification Badge</h2>

    <script>
        // Declare the followers variable
        let followers = 1500;

        // Use a ternary operator
        let badge = followers > 1000 ? "Verified Creator" : "Regular User";

        // Print the badge
        console.log("Followers:", followers);
        console.log("Badge:", badge);
    </script>

</body>
</html>
