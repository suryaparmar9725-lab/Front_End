<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Eligibility</title>
</head>
<body>

    <h2>Discount Eligibility Checker</h2>

    <script>
        // Function to check discount eligibility
        function isEligibleForDiscount(totalAmount) {
            return totalAmount >= 500;
        }

        // Test the function
        console.log("300:", isEligibleForDiscount(300));
        console.log("700:", isEligibleForDiscount(700));
    </script>

</body>
</html>
