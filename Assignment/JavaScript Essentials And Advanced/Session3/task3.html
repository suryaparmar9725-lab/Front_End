<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Tag</title>
</head>
<body>

    <h2>Product Discount Checker</h2>

    <script>
        // Function to check discount
        function showDiscountTag(price) {

            if (price < 500) {
                console.log("Special Discount!");
            } else {
                console.log("Regular Price");
            }

        }

        // Function Calls
        showDiscountTag(450);
        showDiscountTag(750);
    </script>

</body>
</html>
