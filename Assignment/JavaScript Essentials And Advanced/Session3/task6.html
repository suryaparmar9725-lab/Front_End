<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Function</title>
</head>
<body>

    <h2>Instagram Badge Checker</h2>

    <script>
        // Function using the ternary operator
        function getBadge(followers) {
            return followers >= 1000
                ? "Verified Creator ⭐"
                : "Regular User";
        }

        // Test the function
        console.log(getBadge(800));
        console.log(getBadge(1500));
    </script>

</body>
