<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>const Example</title>
</head>
<body>

    <h2>const Reassignment Example</h2>

    <script>
        // Declare a constant
        const MAX_POSTS = 100;

        console.log("MAX_POSTS:", MAX_POSTS);

        // Try to reassign the constant
        MAX_POSTS = 200;

        console.log(MAX_POSTS);
    </script>

</body>
</html>
