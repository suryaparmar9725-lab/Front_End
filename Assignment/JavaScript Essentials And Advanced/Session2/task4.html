<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>var Reassignment Example</title>
</head>
<body>

    <h2>var Reassignment Example</h2>

    <script>
        // Declare a variable using var
        var foodApp = "Zomato";
        console.log("Before Reassignment:", foodApp);

        // Reassign the variable
        foodApp = "Swiggy";
        console.log("After Reassignment:", foodApp);

        // Redeclare the same variable
        var foodApp = "Uber Eats";
        console.log("After Redeclaration:", foodApp);
    </script>

</body>
</html>
