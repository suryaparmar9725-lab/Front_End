<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>const Array Example</title>
</head>
<body>

    <h2>const Array Example</h2>

    <script>
        // Create an array using const
        const favoriteSongs = [
            "Kesariya",
            "Believer",
            "Perfect"
        ];

        // Add a fourth song
        favoriteSongs.push("Shape of You");

        // Print the array
        console.log(favoriteSongs);

        // This works because const prevents reassignment
        // of the variable, not changes to the array contents.
    </script>

</body>
</html>
