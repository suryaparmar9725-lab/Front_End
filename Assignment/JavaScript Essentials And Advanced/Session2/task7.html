<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Profile Object</title>
</head>
<body>

    <h2>Spotify Profile Object</h2>

    <script>
        // Create a JavaScript object
        const spotifyProfile = {
            userName: "Surendra",
            playlists: ["Workout Mix", "Hindi Hits", "Lo-Fi Beats"],
            isPremium: true
        };

        // Log the entire object
        console.log("Spotify Profile:");
        console.log(spotifyProfile);

        // Access and log the playlists property
        console.log("Playlists:");
        console.log(spotifyProfile.playlists);
    </script>

</body>
</html>
