<!DOCTYPE html>
<html>
<head>
    <title>Debug Loop Example</title>
</head>

<body>

    <h2>Friends List Debugging</h2>

    <p>
        Open Chrome DevTools → Sources tab → Set breakpoint inside the loop.
    </p>


    <script>

        // Array of friends
        let friends = [
            "Rahul",
            "Amit",
            "Priya",
            "Neha",
            "Rohan"
        ];


        // Loop through friends array
        for (let i = 0; i < friends.length; i++) {

            // Set breakpoint on this line
            console.log(friends[i]);

        }


    </script>

</body>
</html>
