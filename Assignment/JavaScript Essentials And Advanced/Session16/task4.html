<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Details</title>
</head>
<body>

    <h2>Flipkart Products</h2>

    <div id="productList"></div>

    <script>

        // Array of Flipkart product objects
        let products = [
            {
                name: "iPhone 15",
                price: 70000
            },
            {
                name: "Samsung Galaxy S24",
                price: 60000
            },
            {
                name: "HP Laptop",
                price: 55000
            },
            {
                name: "Boat Earbuds",
                price: 2000
            }
        ];


        // Using map() to create formatted strings
        let productDetails = products.map(function(product) {
            return `Product: ${product.name}, Price: ₹${product.price}`;
        });


        // Display product details
        let output = "";

        productDetails.forEach(function(product) {
            output += `
                <div>
                    <h3>${product}</h3>
                    <hr>
                </div>
            `;
        });


        document.getElementById("productList").innerHTML = output;


        // Show new array in console
        console.log(productDetails);

    </script>

</body>
</html>
