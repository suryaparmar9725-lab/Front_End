<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Teams with While Loop</title>
</head>
<body>

    <h2>IPL Team Names</h2>

    <script>
        // Array of IPL team names
        let iplTeams = [
            "Chennai Super Kings",
            "Mumbai Indians",
            "Royal Challengers Bengaluru",
            "Kolkata Knight Riders",
            "Rajasthan Royals"
        ];

        // Print each team name in uppercase using a while loop
        let i = 0;

        while (i < iplTeams.length) {
            console.log(iplTeams[i].toUpperCase());
            i++;
        }
    </script>

</body>
</html>
