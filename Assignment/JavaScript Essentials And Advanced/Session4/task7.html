<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Products</title>
</head>
<body>

    <h2>Flipkart Product Names</h2>

    <script>
        // Array of Flipkart products
        let products = [
            { name: "Samsung Galaxy S24", price: 74999 },
            { name: "HP Laptop", price: 55999 },
            { name: "Boat Airdopes", price: 1999 },
            { name: "Noise Smart Watch", price: 3499 }
        ];

        // Print only product names using a for...of loop
        for (let product of products) {
            console.log(product.name);
        }
    </script>

</body>
</html>
