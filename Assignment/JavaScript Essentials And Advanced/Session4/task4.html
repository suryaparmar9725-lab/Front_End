<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Usernames</title>
</head>
<body>

    <h2>Instagram Usernames</h2>

    <script>
        // Array of Instagram usernames
        let usernames = [
            "surendra",
            "priya",
            "rahul",
            "aarya",
            "rohit"
        ];

        // Print each username in uppercase using a while loop
        let i = 0;

        while (i < usernames.length) {
            console.log(usernames[i].toUpperCase());
            i++;
        }
    </script>

</body>
</html>
