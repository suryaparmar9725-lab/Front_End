<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Contacts</title>
</head>
<body>

    <h2>WhatsApp Contacts</h2>

    <script>
        // Array of WhatsApp contacts
        const contacts = [
            "Rahul",
            "Priya",
            "Aarya",
            "Rohit",
            "Neha"
        ];

        // Print a message for each contact using forEach
        contacts.forEach((name) => {
            console.log(`Sending hi to ${name} on WhatsApp!`);
        });
    </script>

</body>
</html>
