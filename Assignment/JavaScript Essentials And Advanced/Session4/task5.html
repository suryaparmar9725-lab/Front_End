<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist with Do-While Loop</title>
</head>
<body>

    <h2>Playlist Example</h2>

    <script>
        // Create an array of song names
        let playlist = [
            "Kesariya",
            "Believer",
            "Perfect",
            "Shape of You"
        ];

        // Print each song with its index using a do-while loop
        let i = 0;

        do {
            console.log(i + ": " + playlist[i]);
            i++;
        } while (i < playlist.length);
    </script>

</body>
</html>
