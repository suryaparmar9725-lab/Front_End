<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Example</title>
</head>
<body>

    <h2>My Favorite Playlist</h2>

    <script>
        // Create an array of favorite songs
        let playlist = [
            "Kesariya",
            "Believer",
            "Perfect",
            "Shape of You",
            "Apna Bana Le"
        ];

        // Print each song using a for loop
        for (let i = 0; i < playlist.length; i++) {
            console.log(playlist[i]);
        }
    </script>

</body>
</html>
