<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Order Tracker</title>
</head>
<body>

    <h2>Zomato Order Tracker</h2>

    <script>
        // Array of order statuses
        let orderStatus = [
            "Preparing",
            "Out for delivery",
            "Delivered"
        ];

        // Print each status using a do-while loop
        let i = 0;

        do {
            console.log("Order status: " + orderStatus[i]);
            i++;
        } while (i < orderStatus.length);
    </script>

</body>
</html>
