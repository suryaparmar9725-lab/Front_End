<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Teams - forEach Example</title>
</head>
<body>

    <h2>IPL Teams</h2>

    <script>
        // Array of cricket team names
        const teams = ["MI", "CSK", "RCB", "GT"];

        // Use forEach to print a message for each team
        teams.forEach((team) => {
            console.log(`Go ${team}!`);
        });
    </script>

</body>
</html>
