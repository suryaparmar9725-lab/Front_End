<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Shopping Cart</title>

    <style>
        .cart {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            width: 220px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            position: relative;
        }

        .remove {
            position: absolute;
            right: 10px;
            top: 5px;
            color: red;
            font-size: 22px;
            cursor: pointer;
            font-weight: bold;
        }

        h3 {
            margin-top: 20px;
        }
    </style>

</head>
<body>

    <h2>Flipkart Shopping Cart</h2>

    <div id="cartContainer" class="cart">

        <div class="card">
            <span class="remove">✖</span>
            <h3>iPhone 15</h3>
            <p>Price: ₹70000</p>
        </div>


        <div class="card">
            <span class="remove">✖</span>
            <h3>Laptop HP</h3>
            <p>Price: ₹55000</p>
        </div>


        <div class="card">
            <span class="remove">✖</span>
            <h3>Boat Earbuds</h3>
            <p>Price: ₹2000</p>
        </div>


        <div class="card">
            <span class="remove">✖</span>
            <h3>Smart Watch</h3>
            <p>Price: ₹5000</p>
        </div>

    </div>


    <script>

        let cartContainer = document.getElementById("cartContainer");


        // Event bubbling / Event Delegation
        cartContainer.addEventListener("click", function(event) {


            // Check if X icon is clicked
            if(event.target.classList.contains("remove")) {


                // Remove only clicked card
                event.target.closest(".card").remove();

            }

        });

    </script>

</body>
</html>
