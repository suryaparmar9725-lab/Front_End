<!DOCTYPE html>
<html>
<head>
  <title>Product Search</title>
</head>
<body>

<script>
  const products = [
    { name: "iPhone 15", price: 69999 },
    { name: "Samsung Galaxy S24", price: 74999 },
    { name: "Boat Headphones", price: 1999 }
  ];

  // Callback version
  function searchProductsCallback(searchTerm, callback) {
    setTimeout(() => {
      const result = products.filter(product =>
        product.name.includes(searchTerm)
      );

      callback(result);
    }, 1000);
  }

  searchProductsCallback("Samsung", function(result) {
    console.log("Callback Result:", result);
  });


  // Promise version
  function searchProductsPromise(searchTerm) {
    return new Promise((resolve) => {
      setTimeout(() => {
        const result = products.filter(product =>
          product.name.includes(searchTerm)
        );

        resolve(result);
      }, 1000);
    });
  }

  searchProductsPromise("iPhone")
    .then((result) => {
      console.log("Promise Result:", result);
    });
</script>

</body>
</html>
