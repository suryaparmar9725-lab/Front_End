<!DOCTYPE html>
<html>
<head>
  <title>Payment Promise</title>
</head>
<body>

<script>
  function paymentSuccess() {
    return new Promise((resolve) => {
      setTimeout(() => {
        resolve("Payment successful!");
      }, 1000);
    });
  }

  paymentSuccess().then((message) => {
    console.log(message);
  });
</script>

</body>
</html>
