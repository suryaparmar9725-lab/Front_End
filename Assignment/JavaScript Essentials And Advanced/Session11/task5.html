<!DOCTYPE html>
<html>
<head>
  <title>Followers Promise</title>
</head>
<body>

<script>
  const getFollowersCount = new Promise((resolve) => {
    setTimeout(() => {
      const followers = Math.floor(Math.random() * (5000 - 1000 + 1)) + 1000;

      resolve(followers);
    }, 1000);
  });

  getFollowersCount.then((count) => {
    console.log(`You have ${count} new followers`);
  });
</script>

</body>
</html>
