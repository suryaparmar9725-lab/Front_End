<!DOCTYPE html>
<html>
<head>
<title>Playlist Theme Toggle</title>

<style>

body{
    font-family: Arial;
    padding:20px;
    background:white;
    color:black;
}

.dark-mode{
    background:#222;
    color:white;
}

button{
    padding:10px;
    cursor:pointer;
}

.card{
    padding:15px;
    margin-top:10px;
    border:1px solid gray;
}

</style>

</head>

<body>


<h2>My Playlist Links</h2>

<div class="card">
    🎵 Chill Songs
    <br>
    https://spotify.com/chill
</div>


<button onclick="toggleTheme()">
    Change Theme
</button>



<script>


// Apply saved theme on page load

let theme = localStorage.getItem("theme");


if(theme === "dark"){

    document.body.classList.add("dark-mode");

}




// Toggle Theme Function

function toggleTheme(){


    document.body.classList.toggle("dark-mode");



    if(document.body.classList.contains("dark-mode")){


        localStorage.setItem(
            "theme",
            "dark"
        );


    }
    else{


        localStorage.setItem(
            "theme",
            "light"
        );


    }


}


</script>


</body>
</html>
