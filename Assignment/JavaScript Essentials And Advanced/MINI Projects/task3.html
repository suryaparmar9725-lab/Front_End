<!DOCTYPE html>
<html>
<head>
<title>URL Validation</title>
</head>

<body>

<h2>Check URL</h2>

<script>


function validateURL(url){

    if(
        url.startsWith("https://") &&
        url.includes(".")
    ){
        return true;
    }
    else{
        return false;
    }

}



// Testing

console.log(validateURL("https://google.com"));

console.log(validateURL("http://google.com"));

console.log(validateURL("https://website"));


</script>

</body>
</html>
