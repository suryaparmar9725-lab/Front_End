<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zomato Offer</title>
</head>
<body>

  <h2 id="offer">Today's Offer</h2>

  <script>
    // Select the h2 element
    const offer = document.getElementById("offer");

    // Change the text
    offer.innerHTML = "Flat 50% Off on Zomato Today!";

    // Change the text color
    offer.style.color = "red";
  </script>

</body>
</html>
