<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Expression Example</title>
</head>
<body>

    <h2>Greeting Function Expression</h2>

    <script>
        // Function Expression
        const getGreeting = function(name) {
            return "Hello, " + name + "!";
        };

        // Call the function
        console.log(getGreeting("Rahul"));
        console.log(getGreeting("Priya"));
    </script>

</body>
</html>
