<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function Example</title>
</head>
<body>

    <h2>Arrow Function</h2>

    <script>
        // Arrow Function
        const double = (x) => {
            return x * 2;
        };

        // Test the function
        console.log(double(5));
        console.log(double(10));
    </script>

</body>
</html>
