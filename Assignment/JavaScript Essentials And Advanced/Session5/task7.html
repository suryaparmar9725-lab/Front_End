<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h2 {
            color: #e23744;
        }

        .menu-item {
            width: 250px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .menu-item h3 {
            margin: 0;
            color: #333;
        }

        .menu-item p {
            margin-top: 8px;
            color: #e23744;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Zomato Menu</h2>

    <script>
        // Function Declaration
        function showMenuItem(name, price) {
            let item = document.createElement("div");
            item.className = "menu-item";

            item.innerHTML = `
                <h3>${name}</h3>
                <p>Price: ₹${price}</p>
            `;

            return item;
        }

        // Display three menu items
        document.body.appendChild(showMenuItem("Veg Burger", 149));
        document.body.appendChild(showMenuItem("Margherita Pizza", 299));
        document.body.appendChild(showMenuItem("Cold Coffee", 99));
    </script>

</body>
</html>
