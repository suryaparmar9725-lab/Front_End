<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // check if a number is positive, negative, or zero using an if-else statement
        const num = 10
        if (num > 0) {
            console.log(num, "Is Positive")
        }
        else if (num < 0) {
            console.log(num, "Is Negative")
        }
        else {
            console.log("Number Is Zero")
        }

        //switch statement to display the day of the week
        const day = 3
        switch (day) {
            case 1:
                console.log("Monday");
                break;
            case 2:
                console.log("Tuesday");
                break;
            case 3:
                console.log("Wednesday");
                break;
            case 4:
                console.log("Thursday");
                break;
            case 5:
                console.log("Friday");
                break;
            case 6:
                console.log("Saturday");
                break;
            case 7:
                console.log("Sunday");
                break;
            default:
                console.log("Invalid day number");
        }

    </script>
</body>

</html>
