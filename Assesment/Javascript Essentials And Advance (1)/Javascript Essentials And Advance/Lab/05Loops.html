<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // for loop 1 to 10
        for (let i = 1; i <= 10; i++) {
            console.log(i)
        }

        //while loop to sum all even numbers between 1 and 20
        let n = 1
        let s = 0
        while (n <= 20) {
            if (n % 2 === 0) {
                s += n
            }
            n++;
        }
        console.log("Sum of even numbers from 1 to 20 is:", s);

        //do-while loop that continues to ask the user for input until they enter a number greater than 10
        let userNumber;

        do {
            userNumber = prompt("Enter a number greater than 10:");
            } 
        while (userNumber <= 10);

        console.log("You entered:", userNumber);

    </script>
</body>

</html>
