<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const a = 20
        const b = 10

        //  Arithmetic Operators
        console.log("Sum:-", a + b)
        console.log("sub:-", a - b)
        console.log("Mul:-", a * b)
        console.log("Div:-", a / b)

        // Comparison Operators
        console.log("a and b equal? ->", a == b)
        console.log("a greater than b? ->", a > b);


        //Logical Operators
        let condition1 = (a < 30)
        let condition2 = (b < 40)
        console.log("Are both conditions true? ->",condition1&&condition2);
        

    </script>
</body>

</html>
